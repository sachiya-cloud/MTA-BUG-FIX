    <http_dos_exclude>51.38.205.167</http_dos_exclude>
    <ase>1</ase>
    <module src="mta_mysql.so" />  <!-- # mta_mysql.so on linux -->
    <module src="bcrypt.so" /> <!-- # bcrypt.so on linux -->
    <owner_email_address>admin@owlgaming.net</owner_email_address>

